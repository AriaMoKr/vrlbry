# Builds the static site (tools/build-pages.mjs: the client without the Node server, with the demo
# set's ZIMs pre-rendered) and publishes it to GitHub Pages, on every push to main or by hand.
# One-time setup: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The demo set (tools/demo-set.txt, one ZIM URL per line), cached until the list changes.
      - uses: actions/cache@v4
        with:
          path: .demo
          key: demo-set-${{ hashFiles('tools/demo-set.txt') }}
      - name: Download the demo set
        run: |
          mkdir -p .demo
          while read -r url; do
            [ -n "$url" ] || continue
            file=".demo/$(basename "$url")"
            [ -f "$file" ] || curl -fsSL --retry 3 -o "$file" "$url"
          done < tools/demo-set.txt
          ls -l .demo
      - run: npm run build:pages -- --zims .demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
